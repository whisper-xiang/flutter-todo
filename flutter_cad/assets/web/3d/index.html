    // ----------------- 函数拆分 -----------------
    async function loadConfigJson() {
      try {
        const res = await fetch('./config.json')
        return await res.json()
      } catch (err) {
        console.warn('未找到 config.json 或解析失败，使用默认配置')
        return {
          mode: 'client',
          root: '',
          source: '1303-5504001-01.ocf4',
          wsUrl: '',
          cdnSource: './1303-5504001-01.ocf4',
        }
      }
    }

    async function getConfig() {
      const urlParams = new URLSearchParams(window.location.search)
      let config = await loadConfigJson() // 读取 config.json
      config = { ...config, ...Object.fromEntries(urlParams) } // URL 参数优先覆盖 config.json
      return config
    }

    function getRenderMode(modeStr) {
      switch (modeStr) {
        case 'client':
          return 0
        case 'server':
          return 1
        default:
          return 0
      }
    }

    function getFileConfig(config, renderMode) {
      if (config.file) {
        return { filePath: config.file }
      }
      if (config.cdnSource) {
        return { filePath: config.cdnSource }
      }
      const rootPath = `./${config.root || 'scs'}/`
      const fileName = config.source || '齿轮泵装配示例图.scs'
      let wsUrl = config.wsUrl || undefined
      if (renderMode === 'server') wsUrl = `ws://${wsUrl || '172.16.50.70'}:11182?renderingLocation=ssr`
      return { filePath: `${rootPath}${fileName}`, wsUrl }
    }

    function initViewer(filePath, renderMode, wsUrl) {
      const viewer = new window.GStar3DViewer('app', {
        originFormat: 'rvt2',
        // languagePath: 'https://static-offline-cn.51ake.com/web-cn/test/gstar-web-site/static/js/view3d/lang/h5/vi.json',
        language: 'zh',
        // languageInfo: langJson,
        // treeLanguageInfo: treeJson,
        measureGifPath: 'https://static-offline-cn.51ake.com/web-cn/dev/demo/hoops-h5/measure-guide.gif',
        paymentIconBtns: ['-1'],
        supportFuncBtns: ['-1'],
        // theme: 'blue',
        customBtns: {
          topBar: [
            {
              id: 'ShowFileInfo',
              svg: svg,
              // label: '文件信息',
              onClick: function () {
                const actionList = [
                  // {
                  //   type: 'viewRotate',
                  //   params: {
                  //     angle: 90
                  //   }
                  // },
                  // { type: 'viewDir', params: 'Front' },
                  // { type: 'viewDir', params: 'Left' },
                  // { type: 'viewDir', params: 'Iso' },
                  {
                    type: 'viewCut',
                    params: [
                      {
                        axis: 'xCut',
                        from: 0,
                        to: 50
                      },
                      {
                        axis: 'yCut',
                        from: 0,
                        to: 50
                      },
                      {
                        axis: 'zCut',
                        from: 0,
                        to: 50
                      },
                      {
                        axis: 'xCut',
                        from: 0,
                        to: 0
                      },
                      {
                        axis: 'yCut',
                        from: 50,
                        to: 0
                      },
                      {
                        axis: 'zCut',
                        from: 50,
                        to: 0
                      }
                    ]
                  },
                  {
                    type: 'viewExplore',
                    params: [
                      {
                        from: 0,
                        to: 100
                      },
                      {
                        from: 100,
                        to: 0
                      }
                    ]
                  },
                  // { type: 'viewFreeColor' },
                  // { type: 'viewFreeColor', params: false },
                  { type: 'viewReset' }
                ]

                let recordTime = Date.now()
                wcad.recorderManager?.run(actionList).then(res => {
                  recordTime = Date.now() - recordTime
                  console.log('录制时长: ', recordTime / 1000, '秒')
                  wcad.recorderManager?.play(res.arrayBuffer)
                })
              }
            }
          ]
        },
        viewConfig: {
          endpointUri: filePath
        }
      })
      window.wcad = viewer
      return viewer
    }
    window.onload = async () => {
      try {
        // var vConsole = new VConsole()
        const config = await getConfig()
        const renderMode = getRenderMode(config.mode)
        const { filePath, wsUrl } = getFileConfig(config, config.mode)

        const viewer = initViewer(filePath, renderMode, wsUrl)

        viewer.eventManager.registerCallback('close', () => {
          alert('页面回调：触发close')
        })
        viewer.eventManager.registerCallback('beforeRender', e => {
          console.log('%c%s', 'color: #00258c', 'beforeRender', e)
        })
        viewer.eventManager.registerCallback('afterRender', e => {
          console.log('%c%s', 'color: #00258c', 'afterRender', e)
          // viewer.noteManager.create(loaclNotes)
        })
        viewer.updateOptions({
          paymentIconBtns: [],
          supportFuncBtns: []
        })
        viewer.eventManager.registerCallback('note.change', params => {
          const { action, data, cb, finallyCallBack } = params
          switch (action) {
            case 'add':
            case 'edit':
              cb && cb({ ...data, creatorName: '张三' + Math.floor(Math.random() * 100) })
              break
            case 'delete':
              cb && cb()
              break
            default:
              break
          }
          finallyCallBack && finallyCallBack()
        })
        async function handleEvent(params) {
          console.log('页面回调：触发click.menu', params)
          if (params.eventName.includes('btn-Measure-')) {
            return await new Promise(resolve => setTimeout(() => resolve(false), 100))

            //   return new Promise((resolve, reject) => {

            //       },

            //       }
            //     })
            //   })
          }
        }
        viewer.eventManager.registerCallback('click.menu', handleEvent)
      } catch (error) {
        console.error('初始化失败', error)
      }
