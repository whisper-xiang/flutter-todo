<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>3D Demo View</title>
    <script src="./hoops-web-viewer-monolith.umd.js"></script>
    <script defer="defer" src="./main.js"></script>
  </head>
  <style>
    #root {
      height: 100%;
      box-sizing: border-box;
      padding-bottom: constant(safe-area-inset-bottom);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>

  <body>
    <div id="root"></div>
    <script>
      async function loadConfigJson() {
        try {
          const e = await fetch("./config.json");
          return await e.json();
        } catch (e) {
          return (
            console.warn("未找到 config.json 或解析失败，使用默认配置"),
            {
              cdnSource: "./1303-5504001-01.ocf4",
            }
          );
        }
      }
      async function getConfig() {
        const e = new URLSearchParams(window.location.search);
        let n = await loadConfigJson();
        return ((n = { ...n, ...Object.fromEntries(e) }), n);
      }
      function getRenderMode(e) {
        switch (e) {
          case "client":
          default:
            return 0;
          case "server":
            return 1;
        }
      }
      function getFileConfig(e, n) {
        if (e.file) return { filePath: e.file };
        if (e.cdnSource) return { filePath: e.cdnSource };
      }
      function initViewer() {
        return (window.wcad = new WebCAD({ wrapId: "root" }));
      }
      function renderModel(e, n, t, o) {
        let r = !1;
        r ||
          ((r = !0),
          e
            .render({
              fileSource: n,
              renderMode: t,
              wsUri: o,
              getSubsection: (e) => n.replace(/[^/]+$/, "") + e,
            })
            .then(() => {
              (console.log("渲染完成"), (e.note.mode = "replace"), (r = !1));
            })
            .catch((e) => {
              (console.error("渲染出错: ", e),
                alert("渲染出错,请检查文件是否正确"),
                (r = !1));
            }));
      }
      function bindFileInput(e) {
        document.getElementById("fileInput").onchange = (n) => {
          const t = n.target.files[0];
          if (!t) return;
          if (!t.name.endsWith(".ocf4")) return void alert("仅支持 .ocf4 文件");
          const o = new FileReader();
          (o.readAsArrayBuffer(t),
            (o.onload = async () => {
              const n = getRenderMode((await getConfig()).mode);
              e.render({ fileSource: o.result, renderMode: n });
            }));
        };
      }
      function handleNoteChange(e) {
        const { action: n, data: t, cb: o } = e;
        switch (n) {
          case "add":
          case "edit":
            o &&
              o({
                ...t,
                creatorName: "张三" + Math.floor(100 * Math.random()),
              });
            break;
          case "delete":
            o && o();
        }
      }
      (document.addEventListener(
        "wheel",
        function (e) {
          e.ctrlKey && e.preventDefault();
        },
        { passive: !1 },
      ),
        (window.onload = async () => {
          const e = await getConfig(),
            n = getRenderMode(e.mode),
            { filePath: t, wsUrl: o } = getFileConfig(e, e.mode),
            r = initViewer();
          (r.init({}).then(() => {
            (renderModel(r, t, n, o), bindFileInput(r));
          }),
            r.note.on("change", handleNoteChange));
        }));
    </script>
  </body>
</html>
